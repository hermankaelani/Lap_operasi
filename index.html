/* ================= NAVBAR ================= */

.nav-brand {

}

.nav-menu {

}

.nav-menu button {
  background: transparent;
  border: none;

  font-size: 14px;
  padding: 6px 12px;

}

.nav-menu button:hover {

}

.nav-menu .active {
  background: rgba(255,255,255,0.3);
}

/* logout merah */
.nav-menu button:last-child {
  background: #dc3545;
}

/* hamburger */
.menu-toggle {
  display: none;
  font-size: 22px;
  cursor: pointer;
}

/* ================= CONTAINER ================= */
.container {
  width: 100%;
  max-width: 700px;
  margin: 30px auto;
  background: #ffffff;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

/* ================= FORM ================= */
h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #1f3c88;
}

label {
  font-weight: 600;
  margin-top: 12px;
  display: block;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 6px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

input:focus, select:focus, textarea:focus {
  border-color: #3b82f6;
  outline: none;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

.form-btn {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  background: #28a745;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
}

.form-btn:hover {
  background: #218838;
}

/* ================= TABLE ================= */
.table-responsive {
  width: 100%;
  overflow-x: auto;
}

.table-responsive table {
  width: 100%;
  border-collapse: collapse;
}

.table-responsive th,
.table-responsive td {
  padding: 6px;
  text-align: left;
  white-space: nowrap;
}

/* ================= STATUS ================= */
.spinner {
  display: none;
  text-align: center;
  margin-top: 15px;
}

.success {
  display: none;
  margin-top: 15px;
  padding: 10px;
  background: #d4edda;
  color: #155724;
  border-radius: 5px;
  text-align: center;

/* ================= MOBILE ================= */
@media (max-width: 768px){

  }

  }

    width: 100%;
    text-align: left;
    padding: 10px;
  }

  .table-responsive th,
  .table-responsive td {
    font-size: 12px;
  }
}

 <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script>
    function login(){

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");
      const spinner = document.getElementById("spinnerlogin");

      if(!username || !password){
        alert("Username dan Password wajib diisi");
        return;
      }

      // 🔄 Aktifkan loading
      btn.disabled = true;
      spinner.style.display = "block";

      fetch(SCRIPT_URL, {
        method: "POST",
        body: new URLSearchParams({
          action: "login",
          username: username,
          password: password
        })
      })
      .then(res => res.json())
      .then(res => {

        btn.disabled = false;
        spinner.style.display = "none";

        if(res.result === "success"){

          startAutoLogout();

          sessionStorage.setItem("login", "true");
          sessionStorage.setItem("role", res.role);
          sessionStorage.setItem("username", res.username);

          document.getElementById("loginWrapper").style.display = "none";
          document.getElementById("mainSection").style.display = "block";

        } else {
          alert("Username atau Password salah");
        }

      })
      .catch(err => {
        btn.disabled = false;
        spinner.style.display = "none";
        alert("Terjadi kesalahan koneksi.");
      });
    }
    </script>

    <script>
          const jasaInput = document.getElementById("jasa_operasi");
          const jasaHidden = document.getElementById("jasa_operasi_hidden");

          jasaInput.addEventListener("input", function (e) {
            let value = this.value.replace(/\D/g, "");
            jasaHidden.value = value;

            if (value === "") {
              this.value = "";
              return;
            }

            this.value = new Intl.NumberFormat("id-ID").format(value);

        <!-- get laporan -->
    <script>
      function getLaporan(){

    if(sessionStorage.getItem("login") !== "true"){
    alert("Silakan login terlebih dahulu.");
    return;
    }

    const spinner = document.getElementById("spinner2");
    const hasil = document.getElementById("hasilLaporan");

    const nama_rs = document.getElementById("lap_nama_rs").value;
    const tgl_awal = document.getElementById("lap_tgl_awal").value;
    const tgl_akhir = document.getElementById("lap_tgl_akhir").value;

    if (!nama_rs || !tgl_awal || !tgl_akhir) {
    alert("Lengkapi semua field laporan!");
    return;
    }

    spinner.style.display = "block";
    hasil.innerHTML = "";

    function formatTanggal(tgl) {
    const d = new Date(tgl);
    const day = String(d.getDate()).padStart(2,'0');
    const month = String(d.getMonth()+1).padStart(2,'0');
    const year = d.getFullYear();
    return `${day}/${month}/${year}`;
    }

    fetch(`${SCRIPT_URL}?nama_rs=${encodeURIComponent(nama_rs)}&tgl_awal=${tgl_awal}&tgl_akhir=${tgl_akhir}`)
    .then(response => response.json())
    .then(data => {

    window.laporanCache = data;

    let tabel = `
    <table border="1" cellpadding="5" cellspacing="0" width="100%">
    <thead>
    <tr style="background:#f2f2f2;">
    <th>Aksi</th>
    <th>Tanggal</th>
    <th>Pasien</th>
    <th>Diagnosa</th>
    <th>Tindakan</th>
    <th>Jaminan</th>
    <th>Jasa</th>
    <th>Foto</th>
    </tr>
    </thead>
    <tbody>
    `;

    let totalJasaHitung = 0;

    if(data.detail && data.detail.length > 0){

    data.detail.sort((a,b)=> new Date(a.tanggal) - new Date(b.tanggal));

    data.detail.forEach(row => {

      // console.log("FOTO RAW:", row.foto);
      // console.log(row.foto);console.log(url);

      let fotoHTML = "-";

      if (row.foto) {

      const fotos = row.foto.split(",");

      fotoHTML = fotos.map(id => {

      id = id.trim();

      let thumb = "https://drive.google.com/thumbnail?id=" + id + "&sz=w120";
      let full  = "https://lh3.googleusercontent.com/d/" + id;

      return `<img src="${thumb}"
      style="
      width:60px;
      height:60px;
      object-fit:cover;
      margin:2px;
      border-radius:6px;
      cursor:pointer;
      border:1px solid #ccc;
      "
      loading="lazy"
      onclick="bukaFoto('${full}')">`;

      }).join("");

      }





    // let fotoHTML = "-";

    //   if(row.foto){

    //   const fotos = row.foto.split(",");

    //   fotoHTML = fotos.map(id => {

    //   id = id.trim();

    //   let url = "https://drive.google.com/uc?export=view&id=" + id;

    //   return `<img src="${url}"
    //   style="width:60px;margin:2px;border-radius:4px;cursor:pointer;border:1px solid #ccc"
    //   onclick="bukaFoto('${url}')">`;

    //   }).join("");

      // }

    let jasa = Number(row.jasa) || 0;
    totalJasaHitung += jasa;

    tabel += `
    <tr>
    <td>
    <button onclick="editData('${row.id}')">Edit</button>
    <button onclick="hapusData('${row.id}')">Hapus</button>
    </td>
    <td>${formatTanggal(row.tanggal)}</td>
    <td>${row.pasien}</td>
    <td>${row.diagnosa}</td>
    <td>${row.tindakan}</td>
    <td>${row.jaminan}</td>
    <td style="text-align:right;">Rp ${jasa.toLocaleString()}</td>
    <td>${fotoHTML}</td>
    </tr>
    `;

    });

    }else{

    tabel += `
    <tr>
    <td colspan="8" style="text-align:center;">Tidak ada data</td>
    </tr>
    `;

    }

    tabel += `
    <tr>
    <td colspan="6" style="text-align:right;font-weight:bold;">TOTAL JASA</td>
    <td style="text-align:right;font-weight:bold;">
    Rp ${totalJasaHitung.toLocaleString()}
    </td>
    <td></td>
    </tr>
    </tbody>
    </table>
    `;

    hasil.innerHTML = `

    <div style="text-align:right;margin-top:10px;">
    <button onclick="downloadExcel()" style="padding:6px 14px;cursor:pointer;">
    Download Excel
    </button>
    </div>

    <h3>Laporan ${nama_rs}</h3>

    <b>Periode :</b> ${formatTanggal(tgl_awal)} s/d ${formatTanggal(tgl_akhir)}

    <hr>

    <b>Total Operasi :</b> ${data.total_operasi}<br><br>

    <b>Rincian Jaminan :</b><br>

    Umum : ${data.umum}<br>
    Asuransi : ${data.asuransi}<br>
    BPJS TK : ${data.bpjs}<br>
    BPJS Kesehatan : ${data.bpjskesehatan}<br><br>

    <b>Total Jasa Operasi : Rp ${totalJasaHitung.toLocaleString()}</b>

    <br><br>

    ${tabel}

    `;

    })
    .catch(err=>{
    alert("Gagal mengambil laporan.");
    console.error(err);
    })
    .finally(()=>{
    spinner.style.display = "none";
    });

    }
    </script>
      
      <!-- script hapus -->
    <script>
          function hapusData(id){

            if(!confirm("Yakin ingin hapus data ini?")) return;

            const formData = new FormData();
            formData.append("token", "RAHASIA123");
            formData.append("action", "delete");
            formData.append("id", id);

            fetch(SCRIPT_URL, {
              method: "POST",
              body: formData
            })
            .then(res => res.json())
            .then(data => {
              if(data.result === "success"){
                alert("Data berhasil dihapus");
                getLaporan();
              } else {
                alert("Gagal hapus data");
                console.log(data);
              }
            });
          }
    </script>
          <!-- script edit -->

          <script>

  function editData(id){

  console.log("Edit ID:", id);

  if(!window.laporanCache || !window.laporanCache.detail){
    alert("Data tidak ditemukan");
    return;
  }

  const data = window.laporanCache.detail.find(d => String(d.id) === String(id));

  if(!data){
    alert("Data tidak ditemukan di cache");
    return;
  }

  // pindah ke form
  showForm();

  // isi form
  document.querySelector('[name="nama_rs"]').value =
    document.getElementById("lap_nama_rs").value;

  document.querySelector('[name="tanggal_operasi"]').value = data.tanggal;
  document.querySelector('[name="nama_pasien"]').value = data.pasien;
  document.querySelector('[name="diagnosa"]').value = data.diagnosa;
  document.querySelector('[name="tindakan"]').value = data.tindakan;
  document.querySelector('[name="jaminan"]').value = data.jaminan;

  document.getElementById("jasa_operasi").value =
    Number(data.jasa).toLocaleString("id-ID");

  document.getElementById("jasa_operasi_hidden").value = data.jasa;

  const form = document.getElementById("operasiForm");
  form.dataset.editId = id;


  // ======================
  // TAMPILKAN FOTO LAMA
  // ======================

  const preview = document.getElementById("previewFoto");
  preview.innerHTML = "";

  let fotoArray = [];

  if(data.foto){

  fotoArray = data.foto.split(",").map(f => f.trim());

  fotoArray.forEach((fid,index)=>{

  let thumb = "https://drive.google.com/thumbnail?id=" + fid + "&sz=w200";

      <script>
        // hitung pajak
        function hitungPajakTahunan(data, statusPajak){

          let totalBruto = data.reduce((sum, d) => {
            return sum + (Number(d.total) + Number(d.pajak_rs || 0));
          }, 0);

          // biaya jabatan 5% max 6jt
          let biayaJabatan = totalBruto * 0.05;
          if(biayaJabatan > 6000000) biayaJabatan = 6000000;

          let netto = totalBruto - biayaJabatan;

          // ✅ AMBIL PTKP SESUAI STATUS
          let PTKP = getPTKP(statusPajak);

          let pkp = netto - PTKP;
          if(pkp < 0) pkp = 0;

          // ======================
          // HITUNG PROGRESIF
          // ======================
          let sisa = pkp;
          let pajak = 0;

          if(sisa > 0){
            let lapis = Math.min(sisa, 60000000);
            pajak += lapis * 0.05;
            sisa -= lapis;
          }

          if(sisa > 0){
            let lapis = Math.min(sisa, 190000000);
            pajak += lapis * 0.15;
            sisa -= lapis;
          }

          if(sisa > 0){
            let lapis = Math.min(sisa, 250000000);
            pajak += lapis * 0.25;
            sisa -= lapis;
          }

          if(sisa > 0){
            let lapis = Math.min(sisa, 4500000000);
            pajak += lapis * 0.30;
            sisa -= lapis;
          }

          if(sisa > 0){
            pajak += sisa * 0.35;
          }

          return {
            bruto: totalBruto,
            biaya_jabatan: biayaJabatan,
            netto: netto,
            pkp: pkp,
            ptkp: PTKP, // 🔥 tambahin ini biar bisa ditampilkan
            pph21: pajak
          };
        }
      </script>

 <script>

const perPage = 12;

function loadPenerimaan() {
  const spinner = document.getElementById("spinnerLoadPenerimaan");
  const list = document.getElementById("listPenerimaan");

  spinner.style.display = "block";
  list.innerHTML = "";

  fetch(SCRIPT_URL + "?action=get_penerimaan")
    .then(res => res.json())
    .then(res => {
      if (res.result !== "success") {
        list.innerHTML = "Gagal load data";
        return;
      }

      window.penerimaanCache = res.data || [];

      isiFilterTahun(res.data);
      isiFilterRS(res.data);

      currentPage = 1;
      renderTable();
    })
    .catch(err => {
      list.innerHTML = "Error koneksi";
      console.error(err);
    })
    .finally(() => {
      spinner.style.display = "none";
    });
}

// ======================
// FILTER TAHUN
// ======================
function isiFilterTahun(data) {
  const select = document.getElementById("filterTahun");
  let tahunUnik = [...new Set(data.map(d => d.tahun))].sort((a, b) => b - a);

  select.innerHTML = `<option value="">Semua Tahun</option>`;
  tahunUnik.forEach(t => {
    select.innerHTML += `<option value="${t}">${t}</option>`;
  });
}

// ======================
// FILTER RS
// ======================
function isiFilterRS(data) {
  const select = document.getElementById("filterRS");
  let rsUnik = [...new Set(data.map(d => d.nama_rs))].sort();

  select.innerHTML = `<option value="">Semua RS</option>`;
  rsUnik.forEach(rs => {
    select.innerHTML += `<option value="${rs}">${rs}</option>`;
  });
}

// ======================
// RENDER TABLE
// ======================
function renderTable() {
  const list = document.getElementById("listPenerimaan");
  let data = [...(window.penerimaanCache || [])];

  const keyword = document.getElementById("searchPenerimaan").value.toLowerCase();
  const tahun = document.getElementById("filterTahun").value;
  const sort = document.getElementById("sortPenerimaan").value;
  const rs = document.getElementById("filterRS").value;
  const statusPajak = document.getElementById("statusPajak").value;

  const namaBulan = [
    "",
    "Januari","Februari","Maret","April","Mei","Juni",
    "Juli","Agustus","September","Oktober","November","Desember"
  ];

  // FILTER KEYWORD
  if (keyword) {
    data = data.filter(d =>
      d.nama_rs.toLowerCase().includes(keyword) ||
      (namaBulan[Number(d.bulan)] || "").toLowerCase().includes(keyword)
    );
  }

  // FILTER TAHUN
  if (tahun) {
    data = data.filter(d => String(d.tahun) === String(tahun));
  }

  // FILTER RS
  if (rs) {
    data = data.filter(d => d.nama_rs === rs);
  }

  // SORT
  data.sort((a, b) => {
    return sort === "desc"
      ? (b.tahun - a.tahun || b.bulan - a.bulan)
      : (a.tahun - b.tahun || a.bulan - b.bulan);
  });

  // PAGINATION
  const totalPage = Math.ceil(data.length / perPage) || 1;
  if (currentPage > totalPage) currentPage = totalPage;
  const start = (currentPage - 1) * perPage;
  const pageData = data.slice(start, start + perPage);

  // TOTAL
  let totalSemua = data.reduce((sum, d) => sum + (Number(d.total) || 0), 0);
  let totalBruto = data.reduce((sum, d) => sum + (Number(d.total) + Number(d.pajak_rs || 0)), 0);
  let totalPajakDipotong = data.reduce((sum, d) => sum + (Number(d.pajak_rs) || 0), 0);

  // PAJAK
  let pajakTahunan = hitungPajakTahunan(data, statusPajak);
  let kurangLebihBayar = pajakTahunan.pph21 - totalPajakDipotong;
  let warnaStatus = kurangLebihBayar > 0 ? "#ffdddd" : "#ddffdd";

  // ======================
  // HTML TABLE
  // ======================
  let html = `
    <div style="margin-bottom:10px; font-weight:bold;">
      Total Netto: Rp ${totalSemua.toLocaleString("id-ID")} <br>
      Total Bruto: Rp ${totalBruto.toLocaleString("id-ID")}

      style="margin-bottom:10px;padding:6px 12px;cursor:pointer;">

    <div style="overflow-x:auto;">
      <table border="1" width="100%" cellpadding="5">
        <tr>
          <th>Aksi</th>
          <th>RS</th>
          <th>Bulan</th>
          <th>Tahun</th>
          <th>Netto</th>
          <th>Pajak</th>
          <th>Bruto</th>
          <th>Keterangan</th>
        </tr>
  `;

  if (pageData.length === 0) {
    html += `<tr><td colspan="8" align="center">Tidak ada data</td></tr>`;
  } else {
    pageData.forEach(row => {
      let bruto = Number(row.total) + Number(row.pajak_rs || 0);
      const bulanText = namaBulan[Number(row.bulan)] || row.bulan;

      html += `
      <tr>
        <td>
          <button onclick="editPenerimaan('${row.id}')">Edit</button>
          <button onclick="hapusPenerimaan('${row.id}')">Hapus</button>
        </td>
        <td>${row.nama_rs}</td>
        <td>${bulanText}</td>
        <td>${row.tahun}</td>
        <td>Rp ${Number(row.total).toLocaleString()}</td>
        <td>Rp ${Number(row.pajak_rs || 0).toLocaleString()}</td>
        <td>Rp ${bruto.toLocaleString()}</td>
        <td>${row.keterangan || '-'}</td>
      </tr>`;
    });
  }

  html += `
      </table>
    </div>

    <div style="margin-top:10px;text-align:center;">
      <button onclick="prevPage()" ${currentPage === 1 ? 'disabled' : ''}>Prev</button>
      Halaman ${currentPage} / ${totalPage}
      <button onclick="nextPage()" ${currentPage >= totalPage ? 'disabled' : ''}>Next</button>
    </div>
  `;

  // ======================
  // SIMULASI PAJAK
  // ======================
  html += `
    <div style="margin-top:20px;">
      <div style="margin-bottom:15px; padding:12px; background:#eef; border-left:5px solid #00f;">
        <b>SIMULASI PAJAK (${statusPajak})</b><br><br>

        Bruto: Rp ${pajakTahunan.bruto.toLocaleString("id-ID")}<br>
        Biaya Jabatan: Rp ${pajakTahunan.biaya_jabatan.toLocaleString("id-ID")}<br>
        Netto: Rp ${pajakTahunan.netto.toLocaleString("id-ID")}<br>

        <span style="background:yellow; padding:2px 5px;">
          PKP: Rp ${pajakTahunan.pkp.toLocaleString("id-ID")}
        </span><br>

        <b style="color:red;">
          PPh 21: Rp ${pajakTahunan.pph21.toLocaleString("id-ID")}
        </b>

        <div style="font-size:12px; margin-top:8px; color:#333;">
          • PKP = Netto - PTKP<br>
          • PTKP (${statusPajak}) = Rp ${pajakTahunan.ptkp.toLocaleString("id-ID")}<br>
          • Tarif progresif (5% - 35%)
        </div>
      </div>

      <div style="margin-bottom:15px; padding:12px; background:${warnaStatus}; border-left:5px solid ${kurangLebihBayar > 0 ? "red" : "green"};">
        Pajak Dipotong RS: Rp ${totalPajakDipotong.toLocaleString("id-ID")}<br>

        <b style="color:${kurangLebihBayar > 0 ? "red" : "green"};">
          ${kurangLebihBayar > 0 ? "Kurang Bayar" : "Lebih Bayar"}:
          Rp ${Math.abs(kurangLebihBayar).toLocaleString("id-ID")}
        </b>
      </div>
    </div>
  `;

  list.innerHTML = html;
}

    <script>

      let fotoBase64List = [];

      document.getElementById("foto_operasi").addEventListener("change", async function(){

        const files = this.files;
        const preview = document.getElementById("previewFoto");

        preview.innerHTML = "";
        fotoBase64List = [];

        if(!files.length) return;

        if(files.length > 5){
          alert("Maksimal 5 foto");
          this.value = "";
          return;
        }

        for(const file of files){

          const base64 = await compressImage(file);

          fotoBase64List.push(base64);

          const img = document.createElement("img");
          img.src = base64;
          img.style.width = "100px";
          img.style.margin = "5px";
          img.style.borderRadius = "5px";

          preview.appendChild(img);
        }

      });


     async function compressImage(file){

  return new Promise(resolve => {

    const reader = new FileReader();

    reader.onload = function(e){

      const img = new Image();
      img.src = e.target.result;

      img.onload = function(){

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        const maxWidth = 800;

        let width = img.width;
        let height = img.height;

        if(width > maxWidth){
          height = height * (maxWidth / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;

        ctx.drawImage(img,0,0,width,height);

        const compressed = canvas.toDataURL("image/jpeg",0.5);

        resolve(compressed);

      }

    }

    reader.readAsDataURL(file);

  });

}

    </script>
